name: hubspot-customer-id-generation
prefect-version: 2.19.7

pull:
- prefect.deployments.steps.set_working_directory:
    id: clone-step
    directory: /app
- prefect.deployments.steps.pip_install_requirements:
    directory: "/app"
    requirements_file: requirements.txt 
    stream_output: True

deployments:
- name: hubspot-customer-id-generation-dkr
  entrypoint: src/flows/update_hubspot_customer_id.py:generate_hubspot_customer_ids
  parameters:
    base_url: "https://api.hubapi.com/crm/v3/objects/companies"
    is_dryrun: true
  work_pool:
    name: local-dkr-01
    work_queue_name: default
    job_variables:
      image: "prefect-local-python:latest"
      image_pull_policy: "Never"
  schedules: []
